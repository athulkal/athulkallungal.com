baseURL = 'https://athulkallungal.com/'
languageCode = 'en-us'
title = 'Athul Kallungal'
theme = 'PaperMod'

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]

  [languages.en]
    languageName = "English"
    weight = 1

  [languages.es]
    languageName = "Español"
    weight = 2

[params]
  customCSS = "css/custom.css"
  env = "production"
  disableThemeToggle = true
  ShowShareButtons = false
  categories = true

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 10

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 10  # Adjust the weight as needed

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10  # 

  [[menu.main]]
  identifier = "contact"
  name = "Contact"
  url = "/contact/"
  weight = 10  


